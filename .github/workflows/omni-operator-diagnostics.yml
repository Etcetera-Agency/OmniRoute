# AICODE-TODO: Temporary manual-only artifact capture; remove after TL329 inspection.
name: OmniRoute operator diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-bundle:
    if: github.repository == 'Etcetera-Agency/OmniRoute' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Export emitted operator modules
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/official-backend-overlay.Dockerfile
          target: operator-diagnostics
          platforms: linux/arm64
          outputs: type=local,dest=${{ runner.temp }}/omni-operator-diagnostics
          pull: true
          provenance: false
          build-args: |
            OFFICIAL_BASE_DIGEST=sha256:b08a12e876baa8a5ccadd1ebbe346fe7267dba3b1c9f4fd6bb02070fae41ab6c
          cache-from: type=gha,scope=omni-overlay-main-arm64

      - name: Upload emitted operator modules
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: omni-operator-diagnostics-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/omni-operator-diagnostics/diagnostics/
          if-no-files-found: error
          retention-days: 1
