name: OmniRoute fork checks and main image

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Build the production image only from the current main branch
        required: true
        type: choice
        options: [refs/heads/main]

concurrency:
  group: omni-overlay-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unit, OpenSpec, workflow and static checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund --legacy-peer-deps

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Validate OpenSpec changes
        run: npx --yes @fission-ai/openspec@1.14.0 validate --all --strict --no-interactive

      - name: Install workflow scanners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          actionlint_version=v1.7.12
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/${actionlint_version}/scripts/download-actionlint.bash") "${actionlint_version#v}" "$HOME/.local/bin"
          pipx install zizmor==1.25.2 || pip install --user zizmor==1.25.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint workflow syntax and security
        run: npm run check:workflows -- --ratchet

      - name: Lint implementation slice
        run: >-
          npx eslint --no-ignore
          scripts/ci/check-main-image-current.mjs
          scripts/ci/verify-official-overlay-image.mjs
          tests/unit/build/fork-release-compose-policy.test.mjs
          tests/unit/build/main-image-freshness.test.mjs
          tests/unit/build/omni-overlay-workflow-policy.test.mjs
          tests/unit/build/verify-official-overlay-image.test.mjs

      - name: Check implementation formatting
        run: >-
          npx prettier --check
          .github/workflows/omni-overlay-image.yml
          docker-compose.yml
          docs/ops/FORK_RELEASE_AND_DEPLOYMENT.md
          scripts/ci/check-main-image-current.mjs
          scripts/ci/verify-official-overlay-image.mjs
          tests/unit/build/fork-release-compose-policy.test.mjs
          tests/unit/build/main-image-freshness.test.mjs
          tests/unit/build/omni-overlay-workflow-policy.test.mjs
          tests/unit/build/verify-official-overlay-image.test.mjs

  publish-main-image:
    name: Build, verify and publish the main image
    needs: [checks]
    if: >-
      github.repository == 'Etcetera-Agency/OmniRoute' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.ref == 'refs/heads/main' &&
      github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE_IMAGE: omniroute-overlay:verify-${{ github.sha }}
      FORK_IMAGE: ghcr.io/etcetera-agency/omniroute
      OFFICIAL_IMAGE: ghcr.io/diegosouzapw/omniroute@sha256:754b5e50361dc2802f0b6576456e72a5163cdc991378ce3f212a2f90b771eb96
      OFFICIAL_BASE_DIGEST: sha256:754b5e50361dc2802f0b6576456e72a5163cdc991378ce3f212a2f90b771eb96
      SOURCE_REPOSITORY: https://github.com/Etcetera-Agency/OmniRoute
    concurrency:
      group: omni-overlay-main-publisher
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build native ARM64 candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/official-backend-overlay.Dockerfile
          target: runtime
          platforms: linux/arm64
          tags: ${{ env.CANDIDATE_IMAGE }}
          load: true
          pull: true
          provenance: false
          build-args: |
            OFFICIAL_BASE_DIGEST=${{ env.OFFICIAL_BASE_DIGEST }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.digest=${{ env.OFFICIAL_BASE_DIGEST }}
          cache-from: type=gha,scope=omni-overlay-main-arm64
          cache-to: type=gha,scope=omni-overlay-main-arm64,mode=min,ignore-error=true

      - name: Verify image behavior and official UI parity
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "$OFFICIAL_IMAGE"
          node scripts/ci/verify-official-overlay-image.mjs \
            --candidate "$CANDIDATE_IMAGE" \
            --official "$OFFICIAL_IMAGE" \
            --source "$SOURCE_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --base-digest "$OFFICIAL_BASE_DIGEST"

      - name: Log in to GHCR after candidate acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the verified full-SHA image
        id: publish-sha
        run: |
          set -euo pipefail
          docker tag "$CANDIDATE_IMAGE" "$FORK_IMAGE:$GITHUB_SHA"
          docker push "$FORK_IMAGE:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$FORK_IMAGE:$GITHUB_SHA" | awk '/^Digest:/ { print $2; exit }')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check the current canonical main commit
        id: current-main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-main-image-current.mjs >> "$GITHUB_OUTPUT"

      - name: Move :main only when this run is still current
        id: publish-main
        env:
          GH_TOKEN: ${{ github.token }}
          PRECHECK_MAIN_SHA: ${{ steps.current-main.outputs.main_sha }}
          PRECHECK_IS_CURRENT: ${{ steps.current-main.outputs.is_current }}
        run: |
          set -euo pipefail
          latest_sha="$(GITHUB_TOKEN="$GH_TOKEN" node scripts/ci/check-main-image-current.mjs --print-current)"
          if [[ "$latest_sha" != "$GITHUB_SHA" || "$latest_sha" != "$PRECHECK_MAIN_SHA" || "$PRECHECK_IS_CURRENT" != "true" ]]; then
            echo "main advanced to $latest_sha; retaining the SHA image and leaving :main unchanged"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker tag "$CANDIDATE_IMAGE" "$FORK_IMAGE:main"
          docker push "$FORK_IMAGE:main"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Record published image evidence
        env:
          IMAGE_DIGEST: ${{ steps.publish-sha.outputs.digest }}
          MAIN_TAG_UPDATED: ${{ steps.publish-main.outputs.pushed }}
        run: |
          {
            echo "## OmniRoute main image"
            echo
            echo "- Source: `$SOURCE_REPOSITORY/tree/$GITHUB_SHA`"
            echo "- SHA tag: `$FORK_IMAGE:$GITHUB_SHA`"
            echo "- Manifest digest: `$IMAGE_DIGEST`"
            echo "- Pinned official base: `$OFFICIAL_IMAGE`"
            echo "- OCI source/revision/base labels verified before GHCR login."
            echo "- Current `:main` tag updated: `$MAIN_TAG_UPDATED`."
            echo "- Workflow run: `$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID`"
          } >> "$GITHUB_STEP_SUMMARY"
