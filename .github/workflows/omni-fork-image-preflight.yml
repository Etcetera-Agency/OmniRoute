name: OmniRoute fork image preflight

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      github.repository == 'Etcetera-Agency/OmniRoute' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04-arm
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_IMAGE: omniroute-fork:preflight-${{ github.event.pull_request.head.sha || github.sha }}
      OFFICIAL_BASE_DIGEST: sha256:3e0c119abc8e280f99bd3f3db9a37913caf07e397b465caa1f56bf4feb271e63
      SOURCE_REPOSITORY: https://github.com/Etcetera-Agency/OmniRoute
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ARM64 candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/official-backend-overlay.Dockerfile
          target: runtime-web
          platforms: linux/arm64
          tags: ${{ env.CANDIDATE_IMAGE }}
          load: true
          pull: true
          provenance: false
          build-args: |
            OFFICIAL_BASE_DIGEST=${{ env.OFFICIAL_BASE_DIGEST }}
            OMNIROUTE_BUILD_SHA=${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_REPOSITORY }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.base.digest=${{ env.OFFICIAL_BASE_DIGEST }}
      - name: Verify candidate
        run: |
          node scripts/ci/verify-official-overlay-image.mjs \
            --candidate "$CANDIDATE_IMAGE" \
            --source "$SOURCE_REPOSITORY" \
            --revision "$SOURCE_SHA" \
            --base-digest "$OFFICIAL_BASE_DIGEST"
